<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>考勤记录</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.0/css/bootstrap.min.css}" />
</head>
<body>


<div class="container mt-4">
    <h2>考勤记录</h2>

    <!-- 筛选表单 -->
    <form method="get" class="row g-3 mb-4">
        <div class="col-md-3">
            <input type="date" name="startDate" class="form-control" placeholder="开始日期" th:value="${startDate}"/>
        </div>
        <div class="col-md-3">
            <input type="date" name="endDate" class="form-control" placeholder="结束日期" th:value="${endDate}"/>
        </div>
        <div class="col-md-3">
            <select name="status" class="form-select">
                <option value="">全部状态</option>
                <option value="NORMAL" th:selected="${status == 'NORMAL'}">正常</option>
                <option value="LATE" th:selected="${status == 'LATE'}">迟到</option>
                <option value="ABSENT" th:selected="${status == 'ABSENT'}">缺勤</option>
            </select>
        </div>
        <div class="col-md-3">
            <button type="submit" class="btn btn-primary w-100">查询</button>
        </div>
    </form>

    <!-- 数据表格 -->
    <table class="table table-striped table-hover">
        <thead class="table-dark">
        <tr>
            <th>日期</th>
            <th>课程</th>
            <th>打卡时间</th>
            <th>状态</th>
            <th>备注</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="record : ${records}">
            <td th:text="${#temporals.format(record.checkInTime, 'yyyy-MM-dd')}"></td>
            <td th:text="${record.courseName}"></td>
            <td th:text="${#temporals.format(record.checkInTime, 'HH:mm:ss')}"></td>
            <td>
                        <span class="badge"
                              th:class="${record.status == 'NORMAL'} ? 'bg-success' :
                                        (${record.status == 'LATE'} ? 'bg-warning' : 'bg-danger')"
                              th:text="${record.status == 'NORMAL'} ? '正常' :
                                      (${record.status == 'LATE'} ? '迟到' : '缺勤')">
                        </span>
            </td>
            <td th:text="${record.remark}"></td>
        </tr>
        <tr th:if="${records.empty}">
            <td colspan="5" class="text-center">暂无考勤记录</td>
        </tr>
        </tbody>
    </table>

    <!-- 成功提示 -->
    <div th:if="${successMsg}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${successMsg}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <!-- 错误提示 -->
    <div th:if="${errorMsg}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${errorMsg}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <!-- 分页 -->
    <nav th:if="${totalPages > 0}">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${currentPage == 1} ? 'disabled' : ''">
                <a class="page-link" th:href="@{/attendance/list(page=${currentPage - 1}, size=${size}, startDate=${startDate}, endDate=${endDate}, status=${status})}">上一页</a>
            </li>
            <li class="page-item" th:each="i : ${#numbers.sequence(1, totalPages)}" th:classappend="${i == currentPage} ? 'active' : ''">
                <a class="page-link" th:href="@{/attendance/list(page=${i}, size=${size}, startDate=${startDate}, endDate=${endDate}, status=${status})}" th:text="${i}"></a>
            </li>
            <li class="page-item" th:classappend="${currentPage == totalPages} ? 'disabled' : ''">
                <a class="page-link" th:href="@{/attendance/list(page=${currentPage + 1}, size=${size}, startDate=${startDate}, endDate=${endDate}, status=${status})}">下一页</a>
            </li>
        </ul>
    </nav>
    <div class="mt-3">
        <a href="/page/dashboard" class="btn btn-secondary">🏠 返回首页</a>
    </div>
</div>
</body>
</html>
