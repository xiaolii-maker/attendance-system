<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>考勤记录</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.0/css/bootstrap.min.css}" />
    <style>
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        .table { font-size: 14px; }
        .badge { padding: 5px 10px; border-radius: 20px; }
        .bg-success { background-color: #28a745 !important; }
        .bg-warning { background-color: #ffc107 !important; color: #333; }
        .bg-danger { background-color: #dc3545 !important; }
        .bg-info { background-color: #17a2b8 !important; }
        .filter-bar { background: #f8f9fa; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <div class="card-header bg-primary text-white">
            <h3 class="mb-0">📋 考勤记录</h3>
        </div>
        <div class="card-body">
            <!-- 筛选表单 -->
            <div class="filter-bar">
                <form method="get" class="row g-3">
                    <div class="col-md-3">
                        <label class="form-label">课程</label>
                        <select name="courseId" class="form-select">
                            <option value="">全部课程</option>
                            <option th:each="course : ${courseList}" th:value="${course.courseId}"
                                    th:text="${course.courseName}"
                                    th:selected="${selectedCourse == course.courseId}"></option>
                        </select>
                    </div>
                    <!-- 新增班级筛选 -->
                    <div class="col-md-3">
                        <label class="form-label">班级</label>
                        <select name="className" class="form-select">
                            <option value="">全部班级</option>
                            <option th:each="cls : ${classList}"
                                    th:value="${cls.className}"
                                    th:text="${cls.className}"
                                    th:selected="${selectedClass == cls.className}"></option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">开始日期</label>
                        <input type="date" name="startDate" class="form-control" th:value="${startDate}"/>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">结束日期</label>
                        <input type="date" name="endDate" class="form-control" th:value="${endDate}"/>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">状态</label>
                        <select name="status" class="form-select">
                            <option value="">全部状态</option>
                            <option value="NORMAL" th:selected="${status == 'NORMAL'}">正常</option>
                            <option value="LATE" th:selected="${status == 'LATE'}">迟到</option>
                            <option value="ABSENT" th:selected="${status == 'ABSENT'}">缺勤</option>
                            <option value="LEAVE" th:selected="${status == 'LEAVE'}">请假</option>
                        </select>
                    </div>
                    <div class="col-md-12">
                        <button type="submit" class="btn btn-primary">🔍 查询</button>
                    </div>
                </form>
            </div>

            <!-- 数据表格 -->
            <div class="table-responsive">
                <table class="table table-striped table-hover">
                    <thead class="table-dark">
                    <tr>
                        <th>学号</th>
                        <th>姓名</th>
                        <th>专业</th>
                        <th>班级</th>
                        <th>课程</th>
                        <th>打卡时间</th>
                        <th>状态</th>
                        <th>请假原因</th>
                        <th>审批状态</th>
                        <th>备注</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="record : ${records}">
                        <td th:text="${record.studentId}">—</td>
                        <td th:text="${record.studentName}">—</td>
                        <td th:text="${record.major}">—</td>
                        <td th:text="${record.className}">—</td>
                        <td th:text="${record.courseName}">—</td>
                        <td th:text="${record.checkInTime != null ? #temporals.format(record.checkInTime, 'yyyy-MM-dd HH:mm:ss') : '—'}">—</td>
                        <td>
                                <span class="badge"
                                      th:class="${record.status == '正常'} ? 'bg-success' :
                                               (${record.status == '迟到'} ? 'bg-warning' :
                                               (${record.status == '缺勤'} ? 'bg-danger' :
                                               (${record.status == '请假（已批）'} ? 'bg-info' : 'bg-secondary')))"
                                      th:text="${record.status}">
                                </span>
                        </td>
                        <td th:text="${record.leaveReason != null ? record.leaveReason : '—'}">—</td>
                        <td>
                            <span th:if="${record.leaveStatus == 'APPROVED'}" class="badge bg-success">已通过</span>
                            <span th:if="${record.leaveStatus == 'PENDING'}" class="badge bg-warning">待审批</span>
                            <span th:if="${record.leaveStatus == 'REJECTED'}" class="badge bg-danger">已拒绝</span>
                            <span th:if="${record.leaveStatus == null}">—</span>
                        </td>
                        <td th:text="${record.remark != null ? record.remark : '—'}">—</td>
                    </tr>
                    <tr th:if="${records.empty}">
                        <td colspan="10" class="text-center text-muted">暂无考勤数据</td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <!-- 分页 -->
            <nav th:if="${totalPages > 0}" class="mt-3">
                <ul class="pagination justify-content-center">
                    <li class="page-item" th:classappend="${currentPage == 1} ? 'disabled' : ''">
                        <a class="page-link" th:href="@{/attendance/list(page=${currentPage - 1}, size=${size}, courseId=${selectedCourse}, className=${selectedClass}, startDate=${startDate}, endDate=${endDate}, status=${status})}">上一页</a>
                    </li>
                    <li class="page-item" th:each="i : ${#numbers.sequence(1, totalPages)}" th:classappend="${i == currentPage} ? 'active' : ''">
                        <a class="page-link" th:href="@{/attendance/list(page=${i}, size=${size}, courseId=${selectedCourse}, className=${selectedClass}, startDate=${startDate}, endDate=${endDate}, status=${status})}" th:text="${i}"></a>
                    </li>
                    <li class="page-item" th:classappend="${currentPage == totalPages} ? 'disabled' : ''">
                        <a class="page-link" th:href="@{/attendance/list(page=${currentPage + 1}, size=${size}, courseId=${selectedCourse}, className=${selectedClass}, startDate=${startDate}, endDate=${endDate}, status=${status})}">下一页</a>
                    </li>
                </ul>
            </nav>

            <div class="text-center mt-3">
                <a href="/page/dashboard" class="btn btn-secondary">🏠 返回首页</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
