<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>学生列表</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.0/css/bootstrap.min.css}" />
</head>
<body>
<div class="container mt-4">
    <h2>学生列表</h2>
    <a th:href="@{/page/student/add}" class="btn btn-primary mb-3">新增学生</a>

    <table class="table table-bordered">
        <thead>
        <tr>
            <th>学号</th>
            <th>姓名</th>
            <th>班级</th>
            <th>性别</th>
            <th>年龄</th>
            <th>操作</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="s : ${students}">
            <td th:text="${s.studentId}"></td>
            <td th:text="${s.name}"></td>
            <td th:text="${s.className}"></td>
            <td th:text="${s.gender}"></td>
            <td th:text="${s.age}"></td>
            <td>
                <a th:href="@{/page/student/edit/{id}(id=${s.studentId})}" class="btn btn-sm btn-info">编辑</a>
                <a th:href="@{/page/student/delete/{id}(id=${s.studentId})}"
                   class="btn btn-sm btn-danger"
                   onclick="return confirm('确定删除吗？')">删除</a>
            </td>
        </tr>
        </tbody>
    </table>

    <div th:if="${totalPages > 0}">
        <a th:href="@{/page/student/list(page=${currentPage - 1}, size=10)}" th:if="${currentPage > 1}">上一页</a>
        <span>第 <span th:text="${currentPage}"></span> / <span th:text="${totalPages}"></span> 页</span>
        <a th:href="@{/page/student/list(page=${currentPage + 1}, size=10)}" th:if="${currentPage < totalPages}">下一页</a>
    </div>

    <div class="mb-3">
        <a href="/page/dashboard" class="btn btn-secondary">🏠 返回首页</a>
    </div>

</div>
</body>
</html>
