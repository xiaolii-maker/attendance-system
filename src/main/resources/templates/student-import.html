<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>批量导入学生</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.0/css/bootstrap.min.css}" />
</head>
<body>
<div class="container mt-4" style="max-width: 600px;">
    <div class="card">
        <div class="card-header bg-primary text-white">
            <h3 class="mb-0">📥 批量导入学生名单</h3>
        </div>
        <div class="card-body">
            <!-- 提示信息 -->
            <div th:if="${successMsg}" class="alert alert-success">
                <span th:text="${successMsg}"></span>
            </div>
            <div th:if="${errorMsg}" class="alert alert-danger">
                <span th:text="${errorMsg}"></span>
            </div>

            <form th:action="@{/student/import}" method="post" enctype="multipart/form-data">
                <div class="mb-3">
                    <label class="form-label">选择Excel文件</label>
                    <input type="file" class="form-control" name="file" accept=".xlsx, .xls" required />
                    <div class="form-text">
                        支持 .xlsx 和 .xls 格式，文件包含4列：学号、姓名、专业、班级
                    </div>
                </div>

                <div class="mb-3">
                    <a th:href="@{/template/student.xlsx}" class="btn btn-secondary">📎 下载模板</a>
                </div>

                <button type="submit" class="btn btn-primary w-100">📤 上传并导入</button>
            </form>
        </div>
    </div>
    <div class="text-center mt-3">
        <a href="/page/dashboard" class="btn btn-secondary">🏠 返回首页</a>
    </div>
</div>
</body>
</html>
