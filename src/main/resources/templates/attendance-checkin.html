<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>考勤打卡</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.0/css/bootstrap.min.css}" />
</head>
<body>
<div class="container mt-4">
    <h2>考勤打卡</h2>

    <!-- 错误提示 -->
    <div th:if="${errorMsg}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${errorMsg}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <form th:action="@{/attendance/checkin}" method="post">
        <div class="mb-3">
            <label class="form-label">选择课程</label>
            <select name="courseId" class="form-select" required>
                <option value="">请选择课程</option>
                <option th:each="course : ${courses}" th:value="${course.courseId}"
                        th:text="${course.courseName} + ' - ' + ${course.className} + ' (' + ${course.startTime} + '-' + ${course.endTime} + ')'">
                </option>
            </select>
            <div class="form-text text-muted">温馨提示：可在课程开始前15分钟至开始后30分钟内打卡</div>
        </div>

        <div class="mb-3">
            <label class="form-label">打卡时间</label>
            <input type="text" name="checkInTime" class="form-control"
                   th:value="${#temporals.format(#temporals.createNow(), 'yyyy-MM-dd HH:mm:ss')}" readonly/>
        </div>

        <div class="mb-3">
            <label class="form-label">备注</label>
            <textarea name="remark" class="form-control" rows="3" placeholder="可选：请假原因、备注信息等"></textarea>
        </div>


        <button type="submit" class="btn btn-primary">提交打卡</button>
        <a href="/attendance/list" class="btn btn-secondary">查看记录</a>
    </form>

    <div class="mt-3">
        <a href="/page/dashboard" class="btn btn-secondary">🏠 返回首页</a>
    </div>

</div>
</body>
</html>
